[package]
name = "kobo-invoices"
version = "0.1.0"
edition = "2021"
description = "KOBO invoice registry: invoices recorded on NEAR, paid in USDC, gas sponsored via meta transactions."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
